org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# Minecraft ships deobfuscated since 26.1, so there is no mappings artifact.
minecraft_version=26.2
fabric_loader_version=0.19.3
fabric_version=0.157.0+26.2
loom_version=1.17.19
shadow_version=9.6.1
polymer_version=0.17.5+26.2

# Java toolchain — read by build.gradle, fabric.mod.json and the mixins json. One place to bump.
java_version=25

# --- Optional features ---------------------------------------------------------------------------
# build.gradle gates each of these on the key being present, so delete a block to turn that feature
# off rather than setting it to a falsey value.

# kalic0re's shared helpers, taken from mavenLocal and relocated into this jar rather than depended
# on (see CLAUDE.md, "Sharing code between mods"). List only the common/ subpackages actually used —
# importing one that isn't listed then fails to compile instead of silently bundling it. Republish
# with `cd rkc/mods/kalic0re && ./gradlew publishToMavenLocal` after changing a shared package.
kalic0re_version=0.31.0
kalic0re_shared_packages=rule,config,text,command

# Set on kalic0re itself: declares fabric-api/Polymer compileOnly, so a jar that is never installed
# and never runs doesn't publish a runtime claim its consumers would inherit.
# library_only=true

# --- Dev server ----------------------------------------------------------------------------------
# Present dev_server_port turns on gradle/devserver.gradle: the seeded run/ world, the rcon setup
# devserver.sh needs, and the Quilt smoke-test run. Delete this section for Loom's bare dev server.
# Give a mod sharing a workspace its own ports, outside 25565–25567 (Docker publishes that range).
dev_server_port=25640
dev_rcon_port=25642
dev_rcon_password=dev
# Datapack pack_format for the seeded dev-defaults pack. 107 = MC 26.2; bump with minecraft_version.
# A mod that ships its own datapacks can drop this and set datapack_pack_format instead — one
# property for every pack in the project.
dev_datapack_pack_format=107
# Data version stamped into the seeded options.txt. Without it the client treats the file as schema 0,
# datafixing its key_ entries throws, and no seeded option applies. 4903 = MC 26.2; bump alongside.
dev_client_options_version=4903
# Name the dev client joins under. Present, it skips the offline-mode name prompt and is opped in
# the seeded run/ops.json; delete it to be prompted and join as whoever you type.
dev_client_username=TestPlayer

# Quilt Loader, for the optional `runQuiltServer` task only (see gradle/devserver.gradle / README).
# Quilt has no stable 26.2 release yet, so this tracks the newest actively-updated beta. The rest are
# the loader's runtime libs from its installer manifest (quilt-loader-<ver>.json), which maven
# metadata doesn't expose — keep them in step when bumping quilt_loader_version.
quilt_loader_version=0.31.0-beta.4
quilt_sponge_mixin_version=0.17.4+mixin.0.8.7
quilt_json5_version=1.0.4+final
quilt_config_version=1.3.3
quilt_asm_version=9.10.1
quilt_mixinextras_version=0.5.5


# Mod Properties
mod_version = 0.1.0
mod_name = Polymer Diagonal Walls
mod_description = Server-side diagonal walls, fences, panes, and bars.
mod_authors = ["K. Gadberry"]
mod_website = https://github.com/RainbowKittyClub/polymerdiagonalwalls
mod_issues = https://github.com/RainbowKittyClub/polymerdiagonalwalls/issues
mod_license = Unlicense


# Project Properties
maven_group = club.rainbowkitty.polymerdiagonalwalls
mod_id = polymerdiagonalwalls
entrypoint = club.rainbowkitty.polymerdiagonalwalls.PolymerDiagonalWalls
